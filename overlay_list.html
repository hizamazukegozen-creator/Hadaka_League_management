<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDK LEAGUE - 対戦カードリスト</title>
    <style>
        body {
            background-color: transparent; /* OBS透過用、必要に応じて #0f111a 等に変更 */
            color: #f0f0f0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .list-title {
            font-size: 1.1rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            color: #00ffcc;
            border-bottom: 2px solid #3f466b;
            padding-bottom: 6px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
        }

        .match-card {
            background: rgba(20, 23, 36, 0.9);
            border: 1px solid #3f466b;
            border-radius: 8px;
            padding: 12px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-header {
            font-size: 0.8rem;
            color: #a0a6cc;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .players-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            font-weight: bold;
        }

        .player-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 130px;
        }

        .player-name.winner {
            color: #00ffcc;
            text-shadow: 0 0 6px rgba(0, 255, 204, 0.6);
        }

        /* ご希望のスコア増減コントロール */
        .score-control-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #10121b;
            border: 1px solid #3f466b;
            border-radius: 6px;
            padding: 4px 8px;
            gap: 4px;
        }

        .score-btn {
            background-color: #1a1d2d;
            border: 1px solid #3f466b;
            color: #00d9ff;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.1s;
        }
        .score-btn.minus-p2 {
            color: #ff4655;
            border-color: #ff4655;
        }
        .score-btn:hover {
            background-color: #2a2e45;
        }

        .score-val {
            font-size: 1.1rem;
            font-weight: 900;
            color: #ffcc00;
            width: 24px;
            text-align: center;
            text-shadow: 0 0 6px rgba(255, 204, 0, 0.5);
        }

        .score-divider {
            color: #555;
            margin: 0 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="list-container">
        <div class="list-title">📺 対戦カード & スコア操作</div>
        <div id="overlay-matches-list" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- 動的生成 -->
        </div>
    </div>

    <script>
        function loadDataAndRender() {
            var json = localStorage.getItem('hadaka_league_master_data');
            if (!json) return;
            try {
                var data = JSON.parse(json);
                var matches = data.soloMatches || []; // 個人戦スケジュールを例示。トーナメント等の場合は切り替え可能
                var container = document.getElementById('overlay-matches-list');
                if (!container) return;

                if (matches.length === 0) {
                    container.innerHTML = '<div style="color:#a0a6cc; font-size:0.9rem; text-align:center; padding:20px;">対戦カードがありません</div>';
                    return;
                }

                var html = '';
                matches.forEach(function(m, idx) {
                    var winner = "-";
                    if (m.s1 === 2 && m.s2 < 2) winner = m.p1;
                    else if (m.s2 === 2 && m.s1 < 2) winner = m.p2;

                    var p1WinClass = (winner === m.p1) ? ' winner' : '';
                    var p2WinClass = (winner === m.p2) ? ' winner' : '';

                    html += `
                        <div class="match-card">
                            <div class="match-header">
                                <span>第 ${idx + 1} 試合</span>
                                <span style="color:${winner !== '-' ? '#00ffcc':'#a0a6cc'}">${winner !== '-' ? '勝者: ' + winner : '進行中'}</span>
                            </div>
                            <div class="players-row">
                                <span class="player-name${p1WinClass}">${m.p1}</span>
                                
                                <div class="score-control-box">
                                    <!-- 1P側コントロール -->
                                    <button type="button" class="score-btn" onclick="modifyScore(${idx}, 's1', -1)">-</button>
                                    <span class="score-val">${m.s1}</span>
                                    <button type="button" class="score-btn" onclick="modifyScore(${idx}, 's1', 1)">+</button>
                                    
                                    <span class="score-divider">-</span>
                                    
                                    <!-- 2P側コントロール -->
                                    <button type="button" class="score-btn minus-p2" onclick="modifyScore(${idx}, 's2', -1)">-</button>
                                    <span class="score-val">${m.s2}</span>
                                    <button type="button" class="score-btn" onclick="modifyScore(${idx}, 's2', 1)">+</button>
                                </div>

                                <span class="player-name${p2WinClass}">${m.p2}</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch(e) {
                console.error(e);
            }
        }

        function modifyScore(matchIdx, field, delta) {
            var json = localStorage.getItem('hadaka_league_master_data');
            if (!json) return;
            try {
                var data = JSON.parse(json);
                if (!data.soloMatches || !data.soloMatches[matchIdx]) return;

                var currentVal = data.soloMatches[matchIdx][field];
                var newVal = currentVal + delta;
                if (newVal < 0) newVal = 0;
                if (newVal > 2) newVal = 2; // 2先ルール

                data.soloMatches[matchIdx][field] = newVal;
                localStorage.setItem('hadaka_league_master_data', JSON.stringify(data));
                
                // 即時再描画
                loadDataAndRender();
            } catch(e) {}
        }

        // 定期同期 & 初期ロード
        window.onload = function() {
            loadDataAndRender();
            setInterval(loadDataAndRender, 300);
        };
    </script>
</body>
</html>
