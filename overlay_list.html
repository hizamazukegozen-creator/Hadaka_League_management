<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDK LEAGUE - 対戦カードリスト</title>
    <style>
        body {
            background-color: transparent;
            color: #f0f0f0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 420px;
            margin: 0 auto;
        }

        .list-title {
            font-size: 1.1rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            color: #00ffcc;
            border-bottom: 2px solid #3f466b;
            padding-bottom: 6px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
        }

        /* 被りを完全に回避する縦積カードデザイン */
        .match-card {
            background: rgba(20, 23, 36, 0.95);
            border: 1px solid #3f466b;
            border-radius: 8px;
            padding: 12px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-header {
            font-size: 0.8rem;
            color: #ffcc00;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #2a2e45;
            padding-bottom: 6px;
        }

        /* 1P / 2P プレイヤー行 */
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
        }

        .side-badge {
            font-size: 0.75rem;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .p1-badge { background: #00d9ff; color: #000; }
        .p2-badge { background: #ff4655; color: #fff; }

        .player-name {
            font-size: 1rem;
            font-weight: bold;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .player-name.p1-text { color: #ffffff; }
        .player-name.p2-text { color: #ffffff; }

        .player-name.winner {
            color: #00ffcc !important;
            text-shadow: 0 0 6px rgba(0, 255, 204, 0.6);
        }

        /* スコア単体操作コントロール */
        .score-control {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #10121b;
            border: 1px solid #3f466b;
            border-radius: 6px;
            padding: 2px 6px;
            flex-shrink: 0;
        }

        .score-btn {
            background-color: #1a1d2d;
            border: 1px solid #3f466b;
            color: #00d9ff;
            width: 28px;
            height: 28px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.1s;
        }

        .score-btn.p2-btn {
            color: #ff4655;
            border-color: #ff4655;
        }

        .score-btn:hover {
            background-color: #2a2e45;
        }

        .score-val {
            font-size: 1.1rem;
            font-weight: 900;
            color: #ffcc00;
            width: 22px;
            text-align: center;
        }

        .vs-divider {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 900;
            color: #ff4655;
            letter-spacing: 2px;
            margin: -2px 0;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="list-container">
        <div class="list-title">📺 対戦カード & スコア操作</div>
        <div id="overlay-matches-list" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- 動的生成 -->
        </div>
    </div>

    <script>
        var members = [];
        var teamMatches = [];
        var soloMatches = [];

        function loadDataAndRender() {
            var json = localStorage.getItem('hadaka_league_master_data');
            if (!json) return;
            try {
                var data = JSON.parse(json);
                members = data.members || [];
                teamMatches = data.teamMatches || [];
                soloMatches = data.soloMatches || [];
                var container = document.getElementById('overlay-matches-list');
                if (!container) return;

                var html = '';

                // 1. チーム戦のカード生成
                if (teamMatches.length > 0) {
                    teamMatches.forEach(function(m, mIdx) {
                        var roles = [
                            { key: 'senho', label: '先鋒' },
                            { key: 'jiho', label: '次鋒' },
                            { key: 'fukusho', label: '副将' },
                            { key: 'taisho', label: '大将' }
                        ];
                        roles.forEach(function(r) {
                            var idx1 = m.order1 ? m.order1[r.key] : "";
                            var idx2 = m.order2 ? m.order2[r.key] : "";
                            var p1Name = (idx1 !== "" && members[idx1]) ? members[idx1].name : "（未定）";
                            var p2Name = (idx2 !== "" && members[idx2]) ? members[idx2].name : "（未定）";

                            if (!m.results) m.results = {};
                            if (!m.results[r.key]) m.results[r.key] = { s1: 0, s2: 0, winner: 0 };
                            var res = m.results[r.key];

                            var p1Win = (res.winner === 1) ? ' winner' : '';
                            var p2Win = (res.winner === 2) ? ' winner' : '';

                            html += `
                                <div class="match-card">
                                    <div class="match-header">
                                        <span>${m.t1Name} vs ${m.t2Name}</span>
                                        <span style="color:#00ffcc;">【${r.label}】</span>
                                    </div>
                                    <!-- 1P側 -->
                                    <div class="player-row">
                                        <div class="player-info">
                                            <span class="side-badge p1-badge">1P</span>
                                            <span class="player-name p1-text${p1Win}" title="${p1Name}">${p1Name}</span>
                                        </div>
                                        <div class="score-control">
                                            <button type="button" class="score-btn" onclick="modifyTeamScore(${mIdx}, '${r.key}', 's1', -1)">-</button>
                                            <span class="score-val">${res.s1}</span>
                                            <button type="button" class="score-btn" onclick="modifyTeamScore(${mIdx}, '${r.key}', 's1', 1)">+</button>
                                        </div>
                                    </div>
                                    <div class="vs-divider">VS</div>
                                    <!-- 2P側 -->
                                    <div class="player-row">
                                        <div class="player-info">
                                            <span class="side-badge p2-badge">2P</span>
                                            <span class="player-name p2-text${p2Win}" title="${p2Name}">${p2Name}</span>
                                        </div>
                                        <div class="score-control">
                                            <button type="button" class="score-btn p2-btn" onclick="modifyTeamScore(${mIdx}, '${r.key}', 's2', -1)">-</button>
                                            <span class="score-val">${res.s2}</span>
                                            <button type="button" class="score-btn p2-btn" onclick="modifyTeamScore(${mIdx}, '${r.key}', 's2', 1)">+</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                    });
                }

                // 2. 個人戦のカード生成
                if (soloMatches.length > 0) {
                    soloMatches.forEach(function(m, idx) {
                        var winner = "-";
                        if (m.s1 === 2 && m.s2 < 2) winner = m.p1;
                        else if (m.s2 === 2 && m.s1 < 2) winner = m.p2;

                        var p1Win = (winner === m.p1) ? ' winner' : '';
                        var p2Win = (winner === m.p2) ? ' winner' : '';

                        html += `
                            <div class="match-card">
                                <div class="match-header">
                                    <span>個人戦 第 ${idx + 1} 試合</span>
                                    <span>${winner !== '-' ? '勝者: ' + winner : '進行中'}</span>
                                </div>
                                <!-- 1P側 -->
                                <div class="player-row">
                                    <div class="player-info">
                                        <span class="side-badge p1-badge">1P</span>
                                        <span class="player-name p1-text${p1Win}" title="${m.p1}">${m.p1}</span>
                                    </div>
                                    <div class="score-control">
                                        <button type="button" class="score-btn" onclick="modifySoloScore(${idx}, 's1', -1)">-</button>
                                        <span class="score-val">${m.s1}</span>
                                        <button type="button" class="score-btn" onclick="modifySoloScore(${idx}, 's1', 1)">+</button>
                                    </div>
                                </div>
                                <div class="vs-divider">VS</div>
                                <!-- 2P側 -->
                                <div class="player-row">
                                    <div class="player-info">
                                        <span class="side-badge p2-badge">2P</span>
                                        <span class="player-name p2-text${p2Win}" title="${m.p2}">${m.p2}</span>
                                    </div>
                                    <div class="score-control">
                                        <button type="button" class="score-btn p2-btn" onclick="modifySoloScore(${idx}, 's2', -1)">-</button>
                                        <span class="score-val">${m.s2}</span>
                                        <button type="button" class="score-btn p2-btn" onclick="modifySoloScore(${idx}, 's2', 1)">+</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                if (html === '') {
                    container.innerHTML = '<div style="color:#a0a6cc; font-size:0.9rem; text-align:center; padding:20px;">対戦カードがありません</div>';
                } else {
                    container.innerHTML = html;
                }
            } catch(e) {
                console.error(e);
            }
        }

        function modifySoloScore(matchIdx, field, delta) {
            var json = localStorage.getItem('hadaka_league_master_data');
            if (!json) return;
            try {
                var data = JSON.parse(json);
                if (!data.soloMatches || !data.soloMatches[matchIdx]) return;
                var val = (data.soloMatches[matchIdx][field] || 0) + delta;
                if (val < 0) val = 0;
                if (val > 2) val = 2;
                data.soloMatches[matchIdx][field] = val;
                localStorage.setItem('hadaka_league_master_data', JSON.stringify(data));
                loadDataAndRender();
            } catch(e) {}
        }

        function modifyTeamScore(matchIdx, rKey, field, delta) {
            var json = localStorage.getItem('hadaka_league_master_data');
            if (!json) return;
            try {
                var data = JSON.parse(json);
                if (!data.teamMatches || !data.teamMatches[matchIdx]) return;
                var m = data.teamMatches[matchIdx];
                if (!m.results) m.results = {};
                if (!m.results[rKey]) m.results[rKey] = { s1: 0, s2: 0, winner: 0 };
                
                var val = (m.results[rKey][field] || 0) + delta;
                if (val < 0) val = 0;
                if (val > 2) val = 2;
                m.results[rKey][field] = val;

                if (m.results[rKey].s1 === 2 && m.results[rKey].s2 < 2) {
                    m.results[rKey].winner = 1;
                } else if (m.results[rKey].s2 === 2 && m.results[rKey].s1 < 2) {
                    m.results[rKey].winner = 2;
                } else {
                    m.results[rKey].winner = 0;
                }

                localStorage.setItem('hadaka_league_master_data', JSON.stringify(data));
                loadDataAndRender();
            } catch(e) {}
        }

        window.onload = function() {
            loadDataAndRender();
            setInterval(loadDataAndRender, 300);
        };
    </script>
</body>
</html>
