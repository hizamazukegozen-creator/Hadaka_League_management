<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDK LEAGUE - 対戦カードリスト</title>
    <style>
        html, body {
            background-color: transparent !important;
            color: #f0f0f0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 420px;
            height: 1080px;
            overflow: hidden;
            position: relative;
        }

        .stream-side-panel {
            position: absolute;
            top: 40px;
            left: 20px;
            width: 360px;
            background: rgba(15, 18, 28, 0.95);
            backdrop-filter: blur(6px);
            border: 2px solid #3f466b;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .stream-side-header {
            background: #121522;
            color: #00d9ff;
            padding: 10px 12px;
            font-weight: bold;
            font-size: 0.85rem;
            border-bottom: 1px solid #3f466b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .stream-mode-selector {
            background: #0b0d14;
            color: #fff;
            border: 1px solid #3f466b;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
        }

        .stream-card-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 520px;
        }

        .stream-card-item {
            background: #141724;
            border: 1px solid #2a2e45;
            border-radius: 5px;
            padding: 8px 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .stream-card-item.active-stream {
            border-color: #00d9ff;
            background: #102633;
            box-shadow: 0 0 8px rgba(0, 217, 255, 0.4);
        }

        .stream-card-info {
            flex: 1;
            font-size: 0.8rem;
        }

        .stream-card-teams {
            font-weight: bold;
            color: #fff;
            margin-bottom: 2px;
        }

        .stream-card-sub {
            font-size: 0.72rem;
            color: #b3f0ff;
        }

        .stream-checkbox-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.65rem;
            color: #a0a6cc;
            cursor: pointer;
            gap: 2px;
        }

        .stream-checkbox-label input {
            cursor: pointer;
            width: 14px;
            height: 14px;
            accent-color: #00d9ff;
        }
    </style>
</head>
<body>

    <div class="stream-side-panel">
        <div class="stream-side-header">
            <span>対戦カード一覧</span>
            <select id="stream-mode-select" class="stream-mode-selector" onchange="changeStreamMode(this.value)">
                <option value="team">① チーム戦カード</option>
                <option value="solo">② 個人戦スケジュール</option>
                <option value="tourney">③ トーナメント</option>
            </select>
        </div>
        <div class="stream-card-list" id="stream-card-list-container"></div>
    </div>

    <script>
        var members = [];
        var teamMatches = [];
        var soloMatches = [];
        var tourneyMatches = {};
        var activeStreamMatch = { mode: 'team', matchIndex: 0, subIndex: 'senho' };

        function loadAppData() {
            var json = localStorage.getItem('hadaka_league_master_data');
            if (json) {
                try {
                    var data = JSON.parse(json);
                    members = data.members || [];
                    teamMatches = data.teamMatches || [];
                    soloMatches = data.soloMatches || [];
                    tourneyMatches = data.tourneyMatches || {};
                    if (data.activeStreamMatch) {
                        activeStreamMatch = data.activeStreamMatch;
                    }
                } catch(e) {}
            }
        }

        function saveMasterData() {
            var json = localStorage.getItem('hadaka_league_master_data');
            var data = json ? JSON.parse(json) : {};
            data.members = members;
            data.teamMatches = teamMatches;
            data.soloMatches = soloMatches;
            data.tourneyMatches = tourneyMatches;
            data.activeStreamMatch = activeStreamMatch;
            localStorage.setItem('hadaka_league_master_data', JSON.stringify(data));
        }

        function refreshOverlay() {
            loadAppData();
            renderStreamCardList();
        }

        function changeStreamMode(modeVal) {
            activeStreamMatch.mode = modeVal;
            activeStreamMatch.matchIndex = 0;
            activeStreamMatch.subIndex = (modeVal === 'team') ? 'senho' : 0;
            saveMasterData();
            refreshOverlay();
        }

        function selectStreamMatch(mode, mIdx, subIdx) {
            activeStreamMatch.mode = mode;
            activeStreamMatch.matchIndex = mIdx;
            activeStreamMatch.subIndex = subIdx;
            saveMasterData();
            refreshOverlay();
        }

        function renderStreamCardList() {
            var modeSel = document.getElementById('stream-mode-select');
            if (!modeSel) return;
            modeSel.value = activeStreamMatch.mode;
            var mode = modeSel.value;

            var container = document.getElementById('stream-card-list-container');
            if (!container) return;
            container.innerHTML = '';

            if (mode === 'team') {
                if (teamMatches.length === 0) {
                    container.innerHTML = '<div style="color:#b3f0ff; text-align:center; padding:15px; font-size:0.8rem;">チーム戦の対戦がありません</div>';
                    return;
                }
                teamMatches.forEach(function(m, mIdx) {
                    var roles = [
                        { key: 'senho', label: '先鋒' },
                        { key: 'jiho', label: '次鋒' },
                        { key: 'fukusho', label: '副将' },
                        { key: 'taisho', label: '大将' }
                    ];
                    roles.forEach(function(r) {
                        var idx1 = m.order1 ? m.order1[r.key] : "";
                        var idx2 = m.order2 ? m.order2[r.key] : "";
                        var p1Name = (idx1 !== "" && idx1 !== undefined && members[idx1]) ? members[idx1].name : '未定';
                        var p2Name = (idx2 !== "" && idx2 !== undefined && members[idx2]) ? members[idx2].name : '未定';

                        var isChecked = (activeStreamMatch.matchIndex === mIdx && activeStreamMatch.subIndex === r.key && activeStreamMatch.mode === 'team');

                        var item = document.createElement('div');
                        item.className = 'stream-card-item' + (isChecked ? ' active-stream' : '');
                        item.innerHTML = `
                            <div class="stream-card-info" onclick="selectStreamMatch('team', ${mIdx}, '${r.key}')">
                                <div class="stream-card-teams">${m.t1Name} vs ${m.t2Name}</div>
                                <div class="stream-card-sub">[${r.label}] ${p1Name} vs ${p2Name}</div>
                            </div>
                            <label class="stream-checkbox-label">
                                <input type="checkbox" ${isChecked ? 'checked':''} onclick="selectStreamMatch('team', ${mIdx}, '${r.key}')">
                                <span>表示</span>
                            </label>
                        `;
                        container.appendChild(item);
                    });
                });
            } else if (mode === 'solo') {
                if (soloMatches.length === 0) {
                    container.innerHTML = '<div style="color:#b3f0ff; text-align:center; padding:15px; font-size:0.8rem;">個人戦スケジュールがありません</div>';
                    return;
                }
                soloMatches.forEach(function(sm, smIdx) {
                    var isChecked = (activeStreamMatch.matchIndex === smIdx && activeStreamMatch.mode === 'solo');
                    var item = document.createElement('div');
                    item.className = 'stream-card-item' + (isChecked ? ' active-stream' : '');
                    item.innerHTML = `
                        <div class="stream-card-info" onclick="selectStreamMatch('solo', ${smIdx}, 0)">
                            <div class="stream-card-teams">第${smIdx+1}試合: ${sm.p1} vs ${sm.p2}</div>
                            <div class="stream-card-sub">個人戦リーグ</div>
                        </div>
                        <label class="stream-checkbox-label">
                            <input type="checkbox" ${isChecked ? 'checked':''} onclick="selectStreamMatch('solo', ${smIdx}, 0)">
                            <span>表示</span>
                        </label>
                    `;
                    container.appendChild(item);
                });
            } else if (mode === 'tourney') {
                var keys = Object.keys(tourneyMatches);
                var hasMatches = false;
                keys.forEach(function(rk) {
                    tourneyMatches[rk].forEach(function(tm, tmIdx) {
                        if (tm.p1 && tm.p1 !== '（未定）' && tm.p2 && tm.p2 !== '（未定）') {
                            hasMatches = true;
                            var isChecked = (activeStreamMatch.matchIndex === rk && activeStreamMatch.subIndex === tmIdx && activeStreamMatch.mode === 'tourney');
                            var item = document.createElement('div');
                            item.className = 'stream-card-item' + (isChecked ? ' active-stream' : '');
                            item.innerHTML = `
                                <div class="stream-card-info" onclick="selectStreamMatch('tourney', '${rk}', ${tmIdx})">
                                    <div class="stream-card-teams">${tm.p1} vs ${tm.p2}</div>
                                    <div class="stream-card-sub">トーナメント戦</div>
                                </div>
                                <label class="stream-checkbox-label">
                                    <input type="checkbox" ${isChecked ? 'checked':''} onclick="selectStreamMatch('tourney', '${rk}', ${tmIdx})">
                                    <span>表示</span>
                                </label>
                            `;
                            container.appendChild(item);
                        }
                    });
                });
                if (!hasMatches) {
                    container.innerHTML = '<div style="color:#b3f0ff; text-align:center; padding:15px; font-size:0.8rem;">有効なトーナメント対戦がありません</div>';
                }
            }
        }

        window.onload = function() {
            refreshOverlay();
            window.addEventListener('storage', function(e) {
                if (e.key === 'hadaka_league_master_data') {
                    refreshOverlay();
                }
            });
            setInterval(function() {
                refreshOverlay();
            }, 300);
        };
    </script>
</body>
</html>
