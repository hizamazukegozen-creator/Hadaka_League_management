<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HDK LEAGUE - 対戦カードリスト</title>
    <style>
        body { background-color: transparent; color: #f0f0f0; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 15px; box-sizing: border-box; }
        .list-container { display: flex; flex-direction: column; gap: 12px; max-width: 420px; margin: 0 auto; }
        .list-title { font-size: 1.1rem; font-weight: 900; font-style: italic; color: #00ffcc; border-bottom: 2px solid #3f466b; padding-bottom: 6px; }
        .mode-tabs { display: flex; gap: 6px; background: rgba(20, 23, 36, 0.95); padding: 6px; border-radius: 6px; border: 1px solid #3f466b; }
        .mode-tab-btn { flex: 1; background: #1a1d2d; border: 1px solid #3f466b; color: #a0a6cc; padding: 6px; font-size: 0.8rem; font-weight: bold; border-radius: 4px; cursor: pointer; text-align: center; }
        .mode-tab-btn.active { background: #00ffcc; color: #0f111a; border-color: #00ffcc; }
        .match-card { background: rgba(20, 23, 36, 0.95); border: 1px solid #3f466b; border-radius: 8px; padding: 12px 15px; display: flex; flex-direction: column; gap: 8px; }
        .match-card.is-active { border: 2px solid #00ffcc; box-shadow: 0 0 12px rgba(0, 255, 204, 0.4); }
        .match-header { font-size: 0.8rem; color: #ffcc00; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2e45; padding-bottom: 6px; }
        .stage-select-btn { background: #10121b; border: 1px solid #3f466b; color: #a0a6cc; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
        .stage-select-btn.active { background: #00ffcc; color: #000; font-weight: bold; }
        .player-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .side-badge { font-size: 0.75rem; font-weight: 900; padding: 2px 6px; border-radius: 4px; }
        .p1-badge { background: #00d9ff; color: #000; }
        .p2-badge { background: #ff4655; color: #fff; }
        .player-name { font-size: 1rem; font-weight: bold; color: #ffffff; }
        .score-control { display: flex; align-items: center; gap: 4px; background: #10121b; border: 1px solid #3f466b; border-radius: 6px; padding: 2px 6px; }
        .score-btn { background-color: #1a1d2d; border: 1px solid #3f466b; color: #00d9ff; width: 28px; height: 28px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .score-val { font-size: 1.1rem; font-weight: 900; color: #ffcc00; width: 22px; text-align: center; }
    </style>
</head>
<body>
    <div class="list-container">
        <div class="list-title">📺 対戦カードリスト & 操作</div>
        <div class="mode-tabs">
            <button type="button" class="mode-tab-btn active" id="tab-btn-team" onclick="switchViewMode('team')">チーム戦</button>
            <button type="button" class="mode-tab-btn" id="tab-btn-solo" onclick="switchViewMode('solo')">個人戦</button>
            <button type="button" class="mode-tab-btn" id="tab-btn-tourney" onclick="switchViewMode('tourney')">トーナメント</button>
        </div>
        <div id="overlay-matches-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <script>
        const bc = new BroadcastChannel('hadaka_league_sync_channel');
        var members = [], teamMatches = [], soloMatches = [], tourneyMatches = {};
        var activeStreamMatch = { mode: 'team', matchIndex: 0, subIndex: 'senho' };
        var currentViewMode = 'team';

        function switchViewMode(mode) {
            currentViewMode = mode;
            ['team', 'solo', 'tourney'].forEach(m => {
                var btn = document.getElementById('tab-btn-' + m);
                if (btn) btn.classList.toggle('active', m === mode);
            });
            renderList();
        }

        bc.onmessage = function(e) {
            if (e.data) {
                members = e.data.members || [];
                teamMatches = e.data.teamMatches || [];
                soloMatches = e.data.soloMatches || [];
                tourneyMatches = e.data.tourneyMatches || {};
                if (e.data.activeStreamMatch) activeStreamMatch = e.data.activeStreamMatch;
                renderList();
            }
        };

        function renderList() {
            var container = document.getElementById('overlay-matches-list');
            if (!container) return;
            var html = '';

            if (currentViewMode === 'team') {
                teamMatches.forEach((m, mIdx) => {
                    ['senho', 'jiho', 'fukusho', 'taisho'].forEach(rKey => {
                        var label = rKey === 'senho' ? '先鋒' : rKey === 'jiho' ? '次鋒' : rKey === 'fukusho' ? '副将' : '大将';
                        var idx1 = m.order1 ? m.order1[rKey] : "";
                        var idx2 = m.order2 ? m.order2[rKey] : "";
                        var p1Name = (idx1 !== "" && members[idx1]) ? members[idx1].name : "選手1";
                        var p2Name = (idx2 !== "" && members[idx2]) ? members[idx2].name : "選手2";
                        var res = m.results && m.results[rKey] ? m.results[rKey] : { s1: 0, s2: 0 };
                        var isActive = (activeStreamMatch.mode === 'team' && activeStreamMatch.matchIndex === mIdx && activeStreamMatch.subIndex === rKey);

                        html += `<div class="match-card ${isActive ? 'is-active' : ''}">
                            <div class="match-header"><span>${m.t1Name} vs ${m.t2Name} 【${label}】</span>
                            <button class="stage-select-btn ${isActive ? 'active' : ''}" onclick="setActiveMatch('team', ${mIdx}, '${rKey}')">${isActive ? '📺 配信中' : '📺 メインに表示'}</button></div>
                            <div class="player-row"><div style="display:flex; gap:8px; align-items:center;"><span class="side-badge p1-badge">1P</span><span class="player-name">${p1Name}</span></div>
                            <div class="score-control"><button class="score-btn" onclick="modifyScore('team', ${mIdx}, '${rKey}', 's1', -1)">-</button><span class="score-val">${res.s1}</span><button class="score-btn" onclick="modifyScore('team', ${mIdx}, '${rKey}', 's1', 1)">+</button></div></div>
                            <div class="player-row"><div style="display:flex; gap:8px; align-items:center;"><span class="side-badge p2-badge">2P</span><span class="player-name">${p2Name}</span></div>
                            <div class="score-control"><button class="score-btn" onclick="modifyScore('team', ${mIdx}, '${rKey}', 's2', -1)">-</button><span class="score-val">${res.s2}</span><button class="score-btn" onclick="modifyScore('team', ${mIdx}, '${rKey}', 's2', 1)">+</button></div></div>
                        </div>`;
                    });
                });
            } else if (currentViewMode === 'solo') {
                soloMatches.forEach((m, idx) => {
                    var isActive = (activeStreamMatch.mode === 'solo' && activeStreamMatch.matchIndex === idx);
                    html += `<div class="match-card ${isActive ? 'is-active' : ''}">
                        <div class="match-header"><span>個人戦 第 ${idx + 1} 試合</span>
                        <button class="stage-select-btn ${isActive ? 'active' : ''}" onclick="setActiveMatch('solo', ${idx}, 0)">${isActive ? '📺 配信中' : '📺 メインに表示'}</button></div>
                        <div class="player-row"><div style="display:flex; gap:8px; align-items:center;"><span class="side-badge p1-badge">1P</span><span class="player-name">${m.p1}</span></div>
                        <div class="score-control"><button class="score-btn" onclick="modifyScore('solo', ${idx}, 0, 's1', -1)">-</button><span class="score-val">${m.s1}</span><button class="score-btn" onclick="modifyScore('solo', ${idx}, 0, 's1', 1)">+</button></div></div>
                        <div class="player-row"><div style="display:flex; gap:8px; align-items:center;"><span class="side-badge p2-badge">2P</span><span class="player-name">${m.p2}</span></div>
                        <div class="score-control"><button class="score-btn" onclick="modifyScore('solo', ${idx}, 0, 's2', -1)">-</button><span class="score-val">${m.s2}</span><button class="score-btn" onclick="modifyScore('solo', ${idx}, 0, 's2', 1)">+</button></div></div>
                    </div>`;
                });
            }
            container.innerHTML = html || '<div style="color:#a0a6cc; text-align:center; padding:20px;">カードがありません</div>';
        }

        function setActiveMatch(mode, matchIndex, subIndex) {
            bc.postMessage({ type: 'UPDATE_ACTIVE_MATCH', activeStreamMatch: { mode, matchIndex, subIndex } });
        }

        function modifyScore(mode, matchIndex, subIndex, field, delta) {
            var currentVal = 0;
            if (mode === 'team' && teamMatches[matchIndex] && teamMatches[matchIndex].results[subIndex]) {
                currentVal = teamMatches[matchIndex].results[subIndex][field] || 0;
            } else if (mode === 'solo' && soloMatches[matchIndex]) {
                currentVal = soloMatches[matchIndex][field] || 0;
            }
            var newVal = Math.max(0, currentVal + delta);
            bc.postMessage({ type: 'UPDATE_SCORE_FROM_OVERLAY', mode, matchIndex, subIndex, roundKey: subIndex, field, val: newVal });
        }

        window.onload = function() { bc.postMessage({ type: 'REQUEST_SYNC' }); };
    </script>
</body>
</html>
