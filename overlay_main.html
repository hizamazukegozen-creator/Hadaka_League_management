<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HDK LEAGUE - Top Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: transparent;
            color: #ffffff;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
        }

        /* 画面上部全体を覆う配置コンテナ */
        .overlay-wrapper {
            position: absolute;
            top: 30px;
            left: 0;
            width: 1920px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 中央配置：HDK LEAGUE ロゴ ＆ ステージ枠 --- */
        .header-brand-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
        }

        .brand-logo-text {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            font-style: italic;
        }

        .brand-logo-text .hdk {
            color: #ff2a2a;
            text-shadow: 0 0 12px rgba(255, 42, 42, 0.8);
        }

        .brand-logo-text .league {
            color: #00e5ff;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.8);
        }

        .brand-sub-text {
            font-size: 11px;
            font-weight: 700;
            color: #00e5ff;
            letter-spacing: 4px;
            font-style: italic;
            margin-top: -2px;
            opacity: 0.85;
        }

        /* 対戦カード・ステージタイトル枠 */
        .match-title-box {
            background: rgba(20, 25, 35, 0.92);
            border: 2px solid #00e5ff;
            padding: 5px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            margin-bottom: 15px;
        }

        /* --- プレイヤー枠 ＆ 中央VS/スコア行 --- */
        .main-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 60px;
        }

        /* プレイヤーボックス */
        .player-box {
            width: 500px;
            height: 85px;
            background: rgba(15, 20, 30, 0.95);
            border: 2px solid #00e5ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 0 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        .player-box.p1 {
            justify-content: flex-start;
            border-left: 8px solid #00e5ff;
        }

        .player-box.p2 {
            justify-content: flex-end;
            border-right: 8px solid #ff2a2a;
            text-align: right;
        }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 1px;
        }

        .player-rank {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* 真ん中の VS ＆ スコア表示 */
        .center-score-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 30px;
        }

        .vs-text {
            font-size: 20px;
            font-weight: 900;
            font-style: italic;
            color: #ff2a2a;
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.9);
            margin-bottom: 4px;
        }

        .score-box {
            background: rgba(15, 20, 30, 0.95);
            border: 2px solid #00e5ff;
            border-radius: 8px;
            padding: 5px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
        }

        .score-num {
            font-size: 28px;
            font-weight: 900;
            color: #ffcc00;
            min-width: 30px;
            text-align: center;
        }

        .score-divider {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin: 0 6px;
        }
    </style>
</head>
<body>

    <div class="overlay-wrapper">
        <!-- プレイヤー真ん中上部のロゴ -->
        <div class="header-brand-container">
            <div class="brand-logo-text">
                <span class="hdk">HDK</span> <span class="league">LEAGUE</span>
            </div>
            <div class="brand-sub-text">ANGER MANAGEMENT</div>
        </div>

        <!-- 対戦カード名 -->
        <div id="stream-stage-title" class="match-title-box">
            --- vs ---
        </div>

        <!-- プレイヤーおよび中央スコア -->
        <div class="main-row">
            <div class="player-box p1">
                <div class="player-info">
                    <div id="stream-p1-name" class="player-name">---</div>
                    <div id="stream-p1-detail" class="player-rank">ランク: -</div>
                </div>
            </div>

            <div class="center-score-container">
                <div class="vs-text">VS</div>
                <div class="score-box">
                    <span id="stream-s1" class="score-num">0</span>
                    <span class="score-divider">-</span>
                    <span id="stream-s2" class="score-num">0</span>
                </div>
            </div>

            <div class="player-box p2">
                <div class="player-info">
                    <div id="stream-p2-name" class="player-name">---</div>
                    <div id="stream-p2-detail" class="player-rank">ランク: -</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const bc = new BroadcastChannel('hadaka_league_sync_channel');

        function fetchAndRender() {
            const rawData = localStorage.getItem('hadaka_league_master_data');
            if (!rawData) return;

            try {
                const data = JSON.parse(rawData);
                const members = data.members || [];
                const teamMatches = data.teamMatches || [];
                const soloMatches = data.soloMatches || [];
                const activeMatch = data.activeStreamMatch || { mode: 'team', matchIndex: 0, subIndex: 'senho' };

                let p1Name = "---";
                let p2Name = "---";
                let p1Detail = "ランク: -";
                let p2Detail = "ランク: -";
                let s1 = 0;
                let s2 = 0;
                let stageTitle = "MATCH";

                if (activeMatch.mode === 'team') {
                    const m = teamMatches[activeMatch.matchIndex];
                    if (m) {
                        const rKey = activeMatch.subIndex || 'senho';
                        const roleLabels = { senho: '先鋒', jiho: '次鋒', fukusho: '副将', taisho: '大将' };
                        stageTitle = `${m.t1Name || 'チームA'} vs ${m.t2Name || 'チームB'} 【${roleLabels[rKey] || rKey}】`;

                        const idx1 = m.order1 ? m.order1[rKey] : "";
                        const idx2 = m.order2 ? m.order2[rKey] : "";

                        if (idx1 !== "" && idx1 !== undefined && members[idx1]) {
                            p1Name = members[idx1].name || "---";
                            p1Detail = `ランク: ${members[idx1].rankName || '-'}`;
                        } else {
                            p1Name = "（空き）";
                        }

                        if (idx2 !== "" && idx2 !== undefined && members[idx2]) {
                            p2Name = members[idx2].name || "---";
                            p2Detail = `ランク: ${members[idx2].rankName || '-'}`;
                        } else {
                            p2Name = "（空き）";
                        }

                        if (m.results && m.results[rKey]) {
                            s1 = m.results[rKey].s1 || 0;
                            s2 = m.results[rKey].s2 || 0;
                        }
                    }
                } else if (activeMatch.mode === 'solo') {
                    const sm = soloMatches[activeMatch.matchIndex];
                    if (sm) {
                        stageTitle = `個人戦 第 ${activeMatch.matchIndex + 1} 試合`;
                        p1Name = sm.p1 || "---";
                        p2Name = sm.p2 || "---";
                        p1Detail = "個人戦";
                        p2Detail = "個人戦";
                        s1 = sm.s1 || 0;
                        s2 = sm.s2 || 0;
                    }
                }

                document.getElementById('stream-stage-title').textContent = stageTitle;
                document.getElementById('stream-p1-name').textContent = p1Name;
                document.getElementById('stream-p2-name').textContent = p2Name;
                document.getElementById('stream-p1-detail').textContent = p1Detail;
                document.getElementById('stream-p2-detail').textContent = p2Detail;
                document.getElementById('stream-s1').textContent = s1;
                document.getElementById('stream-s2').textContent = s2;
            } catch (err) {
                console.error("データ描画エラー:", err);
            }
        }

        bc.onmessage = function(e) {
            if (e.data && e.data.type === 'UPDATE_OVERLAY') {
                fetchAndRender();
            }
        };

        window.addEventListener('DOMContentLoaded', fetchAndRender);
        fetchAndRender();
    </script>
</body>
</html>
