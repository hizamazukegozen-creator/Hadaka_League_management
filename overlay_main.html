<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HDK LEAGUE - Main Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: transparent;
            color: #ffffff;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
        }

        /* 画面全体の配置コンテナ（下部固定） */
        .overlay-wrapper {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 1920px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- 上部：HDK LEAGUE ロゴエリア --- */
        .header-brand-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-logo-text {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            font-style: italic;
        }

        .brand-logo-text .hdk {
            color: #ff2a2a; /* HDK：赤 */
            text-shadow: 0 0 12px rgba(255, 42, 42, 0.7);
        }

        .brand-logo-text .league {
            color: #00e5ff; /* LEAGUE：シアン */
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.7);
        }

        .brand-sub-text {
            font-size: 12px;
            font-weight: 700;
            color: #00e5ff; /* ANGER MANAGEMENT：シアン・小さめ */
            letter-spacing: 4px;
            font-style: italic;
            margin-top: -2px;
            opacity: 0.85;
        }

        /* --- 中央：対戦カード名ボックス --- */
        .match-title-box {
            background: rgba(20, 25, 35, 0.9);
            border: 2px solid #00e5ff;
            padding: 6px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
        }

        /* --- 下部：メインプレイヤー＆スコアレイアウト --- */
        .main-row {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0 80px;
        }

        /* プレイヤーボックス共通 */
        .player-box {
            width: 600px;
            height: 90px;
            background: rgba(15, 20, 30, 0.92);
            border: 2px solid #00e5ff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .player-box.p1 {
            justify-content: flex-start;
            border-left: 8px solid #00e5ff;
        }

        .player-box.p2 {
            justify-content: flex-end;
            border-right: 8px solid #ff2a2a;
            text-align: right;
        }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
            letter-spacing: 1px;
        }

        .player-rank {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* --- 中央：VS ＆ スコア表示エリア --- */
        .center-score-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 40px;
            position: relative;
        }

        .vs-text {
            font-size: 20px;
            font-weight: 900;
            font-style: italic;
            color: #ff2a2a;
            text-shadow: 0 0 8px rgba(255, 42, 42, 0.8);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .score-box {
            background: rgba(15, 20, 30, 0.95);
            border: 2px solid #00e5ff;
            border-radius: 8px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        .score-num {
            font-size: 32px;
            font-weight: 900;
            color: #ffcc00;
            min-width: 35px;
            text-align: center;
        }

        .score-divider {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin: 0 8px;
        }
    </style>
</head>
<body>

    <div class="overlay-wrapper">
        <!-- 上部ロゴ＆サブタイトル -->
        <div class="header-brand-container">
            <div class="brand-logo-text">
                <span class="hdk">HDK</span> <span class="league">LEAGUE</span>
            </div>
            <div class="brand-sub-text">ANGER MANAGEMENT</div>
        </div>

        <!-- 対戦カード・ステージタイトル -->
        <div id="stream-stage-title" class="match-title-box">
            ラリー一族 vs 友爺Ch 【先鋒】
        </div>

        <!-- メイン対戦・スコア行 -->
        <div class="main-row">
            <!-- プレイヤー1 -->
            <div class="player-box p1">
                <div class="player-info">
                    <div id="stream-p1-name" class="player-name">跪漬け御膳</div>
                    <div id="stream-p1-detail" class="player-rank">ランク: マスター</div>
                </div>
            </div>

            <!-- 中央 VS & スコア -->
            <div class="center-score-container">
                <div class="vs-text">VS</div>
                <div class="score-box">
                    <span id="stream-s1" class="score-num">0</span>
                    <span class="score-divider">-</span>
                    <span id="stream-s2" class="score-num">0</span>
                </div>
            </div>

            <!-- プレイヤー2 -->
            <div class="player-box p2">
                <div class="player-info">
                    <div id="stream-p2-name" class="player-name">ずなぶる</div>
                    <div id="stream-p2-detail" class="player-rank">ランク: ダイヤモンド</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // BroadcastChannel によるリアルタイム同期処理
        const bc = new BroadcastChannel('hadaka_league_sync_channel');

        function fetchAndRender() {
            const json = localStorage.getItem('hadaka_league_master_data');
            if (!json) return;

            try {
                const data = JSON.parse(json);
                const members = data.members || [];
                const teamMatches = data.teamMatches || [];
                const soloMatches = data.soloMatches || [];
                const activeMatch = data.activeStreamMatch || { mode: 'team', matchIndex: 0, subIndex: 'senho' };

                let p1Name = "---";
                let p2Name = "---";
                let p1Detail = "ランク: -";
                let p2Detail = "ランク: -";
                let s1 = 0;
                let s2 = 0;
                let stageTitle = "FEATURED MATCH";

                if (activeMatch.mode === 'team') {
                    const m = teamMatches[activeMatch.matchIndex];
                    if (m) {
                        stageTitle = `${m.t1Name || 'チームA'} vs ${m.t2Name || 'チームB'}`;
                        const rKey = activeMatch.subIndex;
                        const roleLabels = { senho: '先鋒', jiho: '次鋒', fukusho: '副将', taisho: '大将' };
                        stageTitle += ` 【${roleLabels[rKey] || rKey}】`;

                        const idx1 = m.order1 ? m.order1[rKey] : "";
                        const idx2 = m.order2 ? m.order2[rKey] : "";

                        if (idx1 !== "" && idx1 !== undefined && members[idx1]) {
                            p1Name = members[idx1].name || "P1";
                            p1Detail = `ランク: ${members[idx1].rankName || '-'}`;
                        } else {
                            p1Name = "（空き）";
                        }

                        if (idx2 !== "" && idx2 !== undefined && members[idx2]) {
                            p2Name = members[idx2].name || "P2";
                            p2Detail = `ランク: ${members[idx2].rankName || '-'}`;
                        } else {
                            p2Name = "（空き）";
                        }

                        if (m.results && m.results[rKey]) {
                            s1 = m.results[rKey].s1 || 0;
                            s2 = m.results[rKey].s2 || 0;
                        }
                    }
                } else if (activeMatch.mode === 'solo') {
                    const sm = soloMatches[activeMatch.matchIndex];
                    if (sm) {
                        stageTitle = `個人戦 第 ${activeMatch.matchIndex + 1} 試合`;
                        p1Name = sm.p1 || "P1";
                        p2Name = sm.p2 || "P2";
                        p1Detail = "個人戦";
                        p2Detail = "個人戦";
                        s1 = sm.s1 || 0;
                        s2 = sm.s2 || 0;
                    }
                }

                document.getElementById('stream-stage-title').innerText = stageTitle;
                document.getElementById('stream-p1-name').innerText = p1Name;
                document.getElementById('stream-p2-name').innerText = p2Name;
                document.getElementById('stream-p1-detail').innerText = p1Detail;
                document.getElementById('stream-p2-detail').innerText = p2Detail;
                document.getElementById('stream-s1').innerText = s1;
                document.getElementById('stream-s2').innerText = s2;
            } catch(e) {
                console.error("Render Error:", e);
            }
        }

        bc.onmessage = function(event) {
            if (event.data && event.data.type === 'UPDATE_OVERLAY') {
                fetchAndRender();
            }
        };

        window.onload = fetchAndRender;
        fetchAndRender();
    </script>
</body>
</html>
