<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HDK LEAGUE - Broadcast Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: transparent;
            color: #ffffff;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
        }

        /* オーバーレイコンテナ（画面下部配置） */
        .overlay-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 1600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HDK LEAGUE ロゴ・ヘッダーエリア */
        .brand-header {
            background: rgba(10, 15, 25, 0.9);
            border: 2px solid #00c8ff;
            border-bottom: none;
            padding: 8px 30px;
            border-radius: 10px 10px 0 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 -4px 15px rgba(0, 200, 255, 0.2);
        }

        .brand-title {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .brand-title .brand-hdk {
            color: #ff2a2a; /* HDK：赤 */
            text-shadow: 0 0 10px rgba(255, 42, 42, 0.6);
        }

        .brand-title .brand-league {
            color: #00c8ff; /* LEAGUE：青寄りシアン */
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.6);
        }

        .brand-subtitle {
            font-size: 11px;
            font-weight: 700;
            color: #00c8ff; /* ANGER MANAGEMENT：シアン（小さめ） */
            letter-spacing: 3px;
            margin-top: 2px;
            opacity: 0.9;
        }

        .match-info-label {
            font-size: 14px;
            color: #e2e8f0;
            margin-top: 4px;
            font-weight: 600;
        }

        /* メインスコアボードバー */
        .scoreboard-main {
            display: flex;
            width: 100%;
            height: 100px;
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #00c8ff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 200, 255, 0.15);
            overflow: hidden;
            position: relative;
        }

        /* プレイヤーエリア */
        .player-side {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 35px;
            position: relative;
        }

        .player-side.p1 {
            justify-content: flex-start;
            background: linear-gradient(90deg, rgba(255, 42, 42, 0.15) 0%, transparent 100%);
        }

        .player-side.p2 {
            justify-content: flex-end;
            text-align: right;
            background: linear-gradient(270deg, rgba(0, 200, 255, 0.15) 0%, transparent 100%);
        }

        .player-info {
            display: flex;
            flex-direction: column;
        }

        .player-name {
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
        }

        .player-detail {
            font-size: 16px;
            color: #94a3b8;
            font-weight: 600;
            margin-top: 2px;
        }

        /* スコア中央部（背景ブロック・浮き出を完全に排除） */
        .score-center {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 220px;
            background: transparent;
            position: relative;
            z-index: 2;
        }

        .score-num {
            font-size: 58px;
            font-weight: 900;
            color: #ffffff;
            min-width: 60px;
            text-align: center;
            text-shadow: 0 0 12px rgba(0, 200, 255, 0.8);
        }

        .score-divider {
            font-size: 40px;
            font-weight: 900;
            color: #00c8ff;
            margin: 0 10px;
            opacity: 0.8;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="overlay-container">
        <!-- HDK LEAGUE ヘッダー -->
        <div class="brand-header">
            <div class="brand-title">
                <span class="brand-hdk">HDK</span> <span class="brand-league">LEAGUE</span>
            </div>
            <div class="brand-subtitle">ANGER MANAGEMENT</div>
            <div id="stream-stage-title" class="match-info-label">FEATURED MATCH</div>
        </div>
        
        <!-- スコアボード -->
        <div class="scoreboard-main">
            <!-- P1 -->
            <div class="player-side p1">
                <div class="player-info">
                    <div id="stream-p1-name" class="player-name">---</div>
                    <div id="stream-p1-detail" class="player-detail">ランク: -</div>
                </div>
            </div>

            <!-- スコア表示（背景干渉なし） -->
            <div class="score-center">
                <span id="stream-s1" class="score-num">0</span>
                <span class="score-divider">-</span>
                <span id="stream-s2" class="score-num">0</span>
            </div>

            <!-- P2 -->
            <div class="player-side p2">
                <div class="player-info">
                    <div id="stream-p2-name" class="player-name">---</div>
                    <div id="stream-p2-detail" class="player-detail">ランク: -</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // BroadcastChannel 同期通信処理
        const bc = new BroadcastChannel('hadaka_league_sync_channel');

        function fetchAndRender() {
            const json = localStorage.getItem('hadaka_league_master_data');
            if (!json) return;

            try {
                const data = JSON.parse(json);
                const members = data.members || [];
                const teamMatches = data.teamMatches || [];
                const soloMatches = data.soloMatches || [];
                const activeMatch = data.activeStreamMatch || { mode: 'team', matchIndex: 0, subIndex: 'senho' };

                let p1Name = "---";
                let p2Name = "---";
                let p1Detail = "ランク: -";
                let p2Detail = "ランク: -";
                let s1 = 0;
                let s2 = 0;
                let stageTitle = "MATCH";

                if (activeMatch.mode === 'team') {
                    const m = teamMatches[activeMatch.matchIndex];
                    if (m) {
                        stageTitle = `${m.t1Name || 'チームA'} vs ${m.t2Name || 'チームB'}`;
                        const rKey = activeMatch.subIndex;
                        const roleLabels = { senho: '先鋒', jiho: '次鋒', fukusho: '副将', taisho: '大将' };
                        stageTitle += ` 【${roleLabels[rKey] || rKey}】`;

                        const idx1 = m.order1 ? m.order1[rKey] : "";
                        const idx2 = m.order2 ? m.order2[rKey] : "";

                        if (idx1 !== "" && idx1 !== undefined && members[idx1]) {
                            p1Name = members[idx1].name || "P1";
                            p1Detail = `ランク: ${members[idx1].rankName || '-'}`;
                        } else {
                            p1Name = "（空き）";
                        }

                        if (idx2 !== "" && idx2 !== undefined && members[idx2]) {
                            p2Name = members[idx2].name || "P2";
                            p2Detail = `ランク: ${members[idx2].rankName || '-'}`;
                        } else {
                            p2Name = "（空き）";
                        }

                        if (m.results && m.results[rKey]) {
                            s1 = m.results[rKey].s1 || 0;
                            s2 = m.results[rKey].s2 || 0;
                        }
                    }
                } else if (activeMatch.mode === 'solo') {
                    const sm = soloMatches[activeMatch.matchIndex];
                    if (sm) {
                        stageTitle = `個人戦 第 ${activeMatch.matchIndex + 1} 試合`;
                        p1Name = sm.p1 || "P1";
                        p2Name = sm.p2 || "P2";
                        p1Detail = "個人戦";
                        p2Detail = "個人戦";
                        s1 = sm.s1 || 0;
                        s2 = sm.s2 || 0;
                    }
                }

                document.getElementById('stream-stage-title').innerText = stageTitle;
                document.getElementById('stream-p1-name').innerText = p1Name;
                document.getElementById('stream-p2-name').innerText = p2Name;
                document.getElementById('stream-p1-detail').innerText = p1Detail;
                document.getElementById('stream-p2-detail').innerText = p2Detail;
                document.getElementById('stream-s1').innerText = s1;
                document.getElementById('stream-s2').innerText = s2;
            } catch(e) {
                console.error("Render Error:", e);
            }
        }

        bc.onmessage = function(event) {
            if (event.data && event.data.type === 'UPDATE_OVERLAY') {
                fetchAndRender();
            }
        };

        window.onload = fetchAndRender;
        fetchAndRender();
    </script>
</body>
</html>
