<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HDK LEAGUE - Main Overlay</title>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { background-color: transparent; color: #ffffff; width: 1920px; height: 1080px; overflow: hidden; display: flex; justify-content: center; align-items: flex-start; }
        .overlay-wrapper { margin-top: 50px; display: flex; flex-direction: column; align-items: center; }
        .header-brand-container { display: flex; flex-direction: column; align-items: center; margin-bottom: 8px; }
        .brand-logo-text { font-size: 32px; font-weight: 900; letter-spacing: 2px; font-style: italic; }
        .brand-logo-text .hdk { color: #ff2a2a; text-shadow: 0 0 12px rgba(255, 42, 42, 0.8); }
        .brand-logo-text .league { color: #00e5ff; text-shadow: 0 0 12px rgba(0, 229, 255, 0.8); }
        .brand-sub-text { font-size: 11px; font-weight: 700; color: #00e5ff; letter-spacing: 4px; font-style: italic; margin-top: -2px; }
        .match-title-box { background: rgba(20, 25, 35, 0.92); border: 2px solid #00e5ff; padding: 5px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; color: #ffcc00; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        .main-row { display: flex; align-items: center; justify-content: center; width: 100%; }
        .player-box { width: 500px; height: 85px; background: rgba(15, 20, 30, 0.95); border: 2px solid #00e5ff; border-radius: 10px; display: flex; align-items: center; padding: 0 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.7); }
        .player-box.p1 { justify-content: flex-start; border-left: 8px solid #00e5ff; }
        .player-box.p2 { justify-content: flex-end; border-right: 8px solid #ff2a2a; text-align: right; }
        .player-info { display: flex; flex-direction: column; }
        .player-name { font-size: 28px; font-weight: 900; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .player-rank { font-size: 13px; color: #94a3b8; margin-top: 2px; }
        .center-score-container { display: flex; flex-direction: column; align-items: center; margin: 0 30px; }
        .vs-text { font-size: 20px; font-weight: 900; font-style: italic; color: #ff2a2a; margin-bottom: 4px; text-shadow: 0 0 10px rgba(255,42,42,0.9); }
        .score-box { background: rgba(15, 20, 30, 0.95); border: 2px solid #00e5ff; border-radius: 8px; padding: 5px 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,0.7); }
        .score-num { font-size: 28px; font-weight: 900; color: #ffcc00; min-width: 30px; text-align: center; }
        .score-divider { font-size: 20px; font-weight: bold; color: #ffffff; margin: 0 6px; }
    </style>
</head>
<body>
    <div class="overlay-wrapper">
        <div class="header-brand-container">
            <div class="brand-logo-text"><span class="hdk">HDK</span> <span class="league">LEAGUE</span></div>
            <div class="brand-sub-text">ANGER MANAGEMENT</div>
        </div>
        <div id="stream-stage-title" class="match-title-box">--- vs ---</div>
        <div class="main-row">
            <div class="player-box p1">
                <div class="player-info">
                    <div id="stream-p1-name" class="player-name">---</div>
                    <div id="stream-p1-detail" class="player-rank">ランク: -</div>
                </div>
            </div>
            <div class="center-score-container">
                <div class="vs-text">VS</div>
                <div class="score-box">
                    <span id="stream-s1" class="score-num">0</span>
                    <span class="score-divider">-</span>
                    <span id="stream-s2" class="score-num">0</span>
                </div>
            </div>
            <div class="player-box p2">
                <div class="player-info">
                    <div id="stream-p2-name" class="player-name">---</div>
                    <div id="stream-p2-detail" class="player-rank">ランク: -</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase設定 (ご自身のプロジェクト情報に書き換えてください)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const dataRef = db.ref('hadaka_league/master_data');

        function updateOverlay(d) {
            if (!d) return;
            if (d.stageTitle !== undefined) document.getElementById('stream-stage-title').textContent = d.stageTitle;
            if (d.p1Name !== undefined) document.getElementById('stream-p1-name').textContent = d.p1Name;
            if (d.p2Name !== undefined) document.getElementById('stream-p2-name').textContent = d.p2Name;
            if (d.p1Detail !== undefined) document.getElementById('stream-p1-detail').textContent = d.p1Detail;
            if (d.p2Detail !== undefined) document.getElementById('stream-p2-detail').textContent = d.p2Detail;
            if (d.s1 !== undefined) document.getElementById('stream-s1').textContent = d.s1;
            if (d.s2 !== undefined) document.getElementById('stream-s2').textContent = d.s2;
        }

        // Firebaseのデータ変更を常時監視して即座に反映
        dataRef.on('value', (snapshot) => {
            var data = snapshot.val();
            if (data && data.payload) {
                updateOverlay(data.payload);
            }
        });
    </script>
</body>
</html>
